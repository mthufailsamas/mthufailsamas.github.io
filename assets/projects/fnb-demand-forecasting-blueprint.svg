<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Production F&amp;B Demand Forecasting System blueprint</title>
  <desc id="description">Planned AI engineering system with a demand forecast chart and a lifecycle covering model training, API serving, monitoring, and controlled retraining.</desc>
  <defs>
    <linearGradient id="forecastBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42b8ad" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#42b8ad" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173743" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 50px Arial, sans-serif; fill: #173743; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #607781; }
      .eyebrow { font: 700 14px Arial, sans-serif; letter-spacing: 2px; fill: #087f78; }
      .section { font: 700 20px Arial, sans-serif; fill: #173743; }
      .label { font: 600 15px Arial, sans-serif; fill: #294954; }
      .small { font: 400 13px Arial, sans-serif; fill: #6b8088; }
      .cardTitle { font: 700 15px Arial, sans-serif; fill: #173743; }
      .cardCopy { font: 400 12px Arial, sans-serif; fill: #607781; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#f4f7f5"/>
  <circle cx="1485" cy="75" r="170" fill="#d9eeea"/>
  <circle cx="90" cy="910" r="190" fill="#e9efe7"/>

  <g text-anchor="middle">
    <text class="eyebrow" x="800" y="72">PRODUCTION ML · TARGET SYSTEM</text>
    <text class="title" x="800" y="132">F&amp;B Demand Forecasting</text>
    <text class="subtitle" x="800" y="172">From time-aware training to monitored application serving</text>
    <rect x="674" y="196" width="252" height="36" rx="18" fill="#fff4db" stroke="#d79a25"/>
    <circle cx="700" cy="214" r="6" fill="#d79a25"/>
    <text x="814" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#8b6419">IN DEVELOPMENT</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="272" width="1000" height="500" rx="18" fill="#ffffff" stroke="#cfdbd9"/>
  </g>
  <text class="section" x="126" y="318">Demand outlook</text>
  <text class="small" x="126" y="343">Historical demand and the planned forecast interface</text>

  <g stroke="#dfe8e6" stroke-width="1">
    <line x1="160" y1="408" x2="1030" y2="408"/>
    <line x1="160" y1="488" x2="1030" y2="488"/>
    <line x1="160" y1="568" x2="1030" y2="568"/>
    <line x1="160" y1="648" x2="1030" y2="648"/>
    <line x1="275" y1="380" x2="275" y2="690"/>
    <line x1="430" y1="380" x2="430" y2="690"/>
    <line x1="585" y1="380" x2="585" y2="690"/>
    <line x1="740" y1="380" x2="740" y2="690"/>
    <line x1="895" y1="380" x2="895" y2="690"/>
  </g>

  <line x1="160" y1="690" x2="1030" y2="690" stroke="#9fb2b5" stroke-width="2"/>
  <line x1="160" y1="380" x2="160" y2="690" stroke="#9fb2b5" stroke-width="2"/>
  <text class="small" x="128" y="570" transform="rotate(-90 128 570)">Demand units</text>
  <text class="small" x="305" y="727">Historical demand</text>
  <text class="small" x="835" y="727">Forecast horizon</text>

  <path d="M160 610 C205 585,230 530,275 550 S350 625,400 560 S485 455,535 505 S610 635,660 550 S715 435,740 470"
        fill="none" stroke="#173743" stroke-width="6" stroke-linecap="round"/>
  <path d="M740 430 C790 395,830 410,870 445 S940 525,1030 470 L1030 605 C955 575,915 545,870 525 S795 520,740 555 Z"
        fill="url(#forecastBand)"/>
  <path d="M740 492 C790 458,828 466,870 492 S945 550,1030 523"
        fill="none" stroke="#087f78" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10"/>
  <line x1="740" y1="368" x2="740" y2="697" stroke="#d79a25" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="663" y="352" width="154" height="30" rx="15" fill="#fff4db"/>
  <text x="740" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8b6419">FORECAST START</text>

  <g transform="translate(176 656)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#173743" stroke-width="5" stroke-linecap="round"/>
    <text class="small" x="52" y="5">Actual demand</text>
    <line x1="180" y1="0" x2="220" y2="0" stroke="#087f78" stroke-width="5" stroke-dasharray="10 7" stroke-linecap="round"/>
    <text class="small" x="232" y="5">Model forecast</text>
    <rect x="380" y="-9" width="42" height="18" rx="4" fill="#42b8ad" opacity="0.20"/>
    <text class="small" x="434" y="5">Uncertainty band</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1130" y="272" width="380" height="500" rx="18" fill="#0e2c36"/>
  </g>
  <text x="1170" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#6bd2c8">MODEL LIFECYCLE</text>

  <g>
    <rect x="1170" y="352" width="300" height="78" rx="12" fill="#153944" stroke="#32717a"/>
    <circle cx="1206" cy="391" r="18" fill="#dff3ef"/>
    <path d="M1198 393 L1204 399 L1216 382" fill="none" stroke="#087f78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1240" y="382" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">TRAIN &amp; SELECT</text>
    <text x="1240" y="405" font-family="Arial, sans-serif" font-size="12" fill="#b9cdd1">Baseline · XGBoost · TensorFlow</text>

    <line x1="1320" y1="430" x2="1320" y2="450" stroke="#6bd2c8" stroke-width="3"/>
    <path d="M1313 444 L1320 452 L1327 444" fill="none" stroke="#6bd2c8" stroke-width="3"/>

    <rect x="1170" y="452" width="300" height="78" rx="12" fill="#153944" stroke="#32717a"/>
    <circle cx="1206" cy="491" r="18" fill="#dff3ef"/>
    <path d="M1197 491 H1215 M1206 482 V500" stroke="#087f78" stroke-width="4" stroke-linecap="round"/>
    <text x="1240" y="482" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">SERVE</text>
    <text x="1240" y="505" font-family="Arial, sans-serif" font-size="12" fill="#b9cdd1">FastAPI · versioned model · Docker</text>

    <line x1="1320" y1="530" x2="1320" y2="550" stroke="#6bd2c8" stroke-width="3"/>
    <path d="M1313 544 L1320 552 L1327 544" fill="none" stroke="#6bd2c8" stroke-width="3"/>

    <rect x="1170" y="552" width="300" height="78" rx="12" fill="#153944" stroke="#32717a"/>
    <circle cx="1206" cy="591" r="18" fill="#dff3ef"/>
    <polyline points="1196,597 1202,589 1208,594 1217,582" fill="none" stroke="#087f78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1240" y="582" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">MONITOR</text>
    <text x="1240" y="605" font-family="Arial, sans-serif" font-size="12" fill="#b9cdd1">Forecast error · drift · latency</text>

    <line x1="1320" y1="630" x2="1320" y2="650" stroke="#6bd2c8" stroke-width="3"/>
    <path d="M1313 644 L1320 652 L1327 644" fill="none" stroke="#6bd2c8" stroke-width="3"/>

    <rect x="1170" y="652" width="300" height="78" rx="12" fill="#153944" stroke="#32717a"/>
    <circle cx="1206" cy="691" r="18" fill="#fff4db"/>
    <path d="M1198 690 A9 9 0 1 1 1205 700 M1197 688 L1198 697 L1207 696" fill="none" stroke="#d79a25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1240" y="682" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">IMPROVE</text>
    <text x="1240" y="705" font-family="Arial, sans-serif" font-size="12" fill="#b9cdd1">Evaluate · retrain · controlled promote</text>
  </g>

  <g>
    <rect x="90" y="820" width="1420" height="78" rx="14" fill="#ffffff" stroke="#cfdbd9"/>
    <text class="eyebrow" x="125" y="852">TARGET OPERATING FLOW</text>
    <text class="label" x="125" y="879">Demand data</text>
    <text class="small" x="260" y="879">→</text>
    <text class="label" x="300" y="879">Feature pipeline</text>
    <text class="small" x="468" y="879">→</text>
    <text class="label" x="508" y="879">Model registry</text>
    <text class="small" x="650" y="879">→</text>
    <text class="label" x="690" y="879">Forecast API</text>
    <text class="small" x="818" y="879">→</text>
    <text class="label" x="858" y="879">Monitoring</text>
    <text class="small" x="970" y="879">→</text>
    <text class="label" x="1010" y="879">Controlled retraining</text>
  </g>
</svg>
