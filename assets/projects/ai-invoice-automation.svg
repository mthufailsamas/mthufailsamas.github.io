<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">AI Invoice Approval Automation architecture</title>
  <desc id="desc">A vendor invoice moves through authenticated n8n intake, Gemini structured extraction, deterministic Python validation, PostgreSQL audit state, human approval, and an idempotent ERP sandbox.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b24"/>
      <stop offset="1" stop-color="#143842"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143842"/>
      <stop offset="1" stop-color="#0b2530"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b0c742"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="url(#background)"/>
  <circle cx="1460" cy="80" r="230" fill="#0d7975" opacity="0.18"/>
  <circle cx="85" cy="850" r="250" fill="#b84d38" opacity="0.12"/>

  <text x="90" y="105" fill="#b0c742" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">APPLIED AI AUTOMATION</text>
  <text x="90" y="165" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="750">AI Invoice Approval</text>
  <text x="90" y="218" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="750">Automation</text>
  <text x="90" y="265" fill="#bfd0d3" font-family="Segoe UI, Arial, sans-serif" font-size="23">LLM proposal • deterministic controls • human approval</text>

  <g filter="url(#shadow)">
    <rect x="90" y="350" width="230" height="250" rx="20" fill="#ffffff"/>
    <rect x="375" y="350" width="230" height="250" rx="20" fill="url(#panel)" stroke="#58bdb5" stroke-width="2"/>
    <rect x="660" y="350" width="260" height="250" rx="20" fill="url(#panel)" stroke="#58bdb5" stroke-width="2"/>
    <rect x="975" y="350" width="230" height="250" rx="20" fill="url(#panel)" stroke="#58bdb5" stroke-width="2"/>
    <rect x="1260" y="350" width="250" height="250" rx="20" fill="#f1f6e5"/>
  </g>

  <path d="M320 475 H365" stroke="#b0c742" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M605 475 H650" stroke="#b0c742" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M920 475 H965" stroke="#b0c742" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M1205 475 H1250" stroke="#b0c742" stroke-width="7" marker-end="url(#arrow)"/>

  <g transform="translate(145 390)">
    <path d="M18 0 H98 L140 42 V150 H18 Z" fill="#f2f6f5" stroke="#0d7975" stroke-width="5"/>
    <path d="M98 0 V42 H140" fill="none" stroke="#0d7975" stroke-width="5"/>
    <path d="M42 75 H115 M42 98 H115 M42 121 H90" stroke="#b84d38" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="205" y="570" text-anchor="middle" fill="#071b24" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">Synthetic invoice</text>
  <text x="205" y="593" text-anchor="middle" fill="#5d7077" font-family="Segoe UI, Arial, sans-serif" font-size="15">PDF / image</text>

  <g transform="translate(438 390)">
    <circle cx="52" cy="60" r="48" fill="none" stroke="#58bdb5" stroke-width="10"/>
    <circle cx="52" cy="60" r="18" fill="#b0c742"/>
    <path d="M52 0 V18 M52 102 V120 M-8 60 H10 M94 60 H112 M10 18 L23 31 M81 89 L94 102 M10 102 L23 89 M81 31 L94 18" stroke="#58bdb5" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="490" y="548" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="750">n8n</text>
  <text x="490" y="577" text-anchor="middle" fill="#bfd0d3" font-family="Segoe UI, Arial, sans-serif" font-size="16">Auth • branch • retry</text>

  <g transform="translate(706 382)">
    <rect x="0" y="0" width="168" height="64" rx="16" fill="#0d7975"/>
    <text x="84" y="40" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">GEMINI</text>
    <rect x="0" y="82" width="168" height="64" rx="16" fill="#b84d38"/>
    <text x="84" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">PYTHON</text>
  </g>
  <text x="790" y="555" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">Extract + validate</text>
  <text x="790" y="582" text-anchor="middle" fill="#bfd0d3" font-family="Segoe UI, Arial, sans-serif" font-size="15">Schema • rules • guard</text>

  <g transform="translate(1022 390)">
    <ellipse cx="68" cy="24" rx="64" ry="24" fill="#58bdb5"/>
    <path d="M4 24 V132 C4 146 33 158 68 158 C103 158 132 146 132 132 V24" fill="#0d7975"/>
    <ellipse cx="68" cy="78" rx="64" ry="24" fill="none" stroke="#58bdb5" stroke-width="5"/>
    <ellipse cx="68" cy="132" rx="64" ry="24" fill="none" stroke="#58bdb5" stroke-width="5"/>
  </g>
  <text x="1090" y="570" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="750">PostgreSQL</text>
  <text x="1090" y="593" text-anchor="middle" fill="#bfd0d3" font-family="Segoe UI, Arial, sans-serif" font-size="15">State • audit • idempotency</text>

  <g transform="translate(1305 382)">
    <circle cx="78" cy="42" r="35" fill="#0d7975"/>
    <path d="M25 138 C30 92 53 73 78 73 C103 73 126 92 131 138" fill="#0d7975"/>
    <circle cx="158" cy="100" r="48" fill="#ffffff" stroke="#b0c742" stroke-width="8"/>
    <path d="M135 101 L151 117 L181 82" fill="none" stroke="#0d7975" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1385" y="555" text-anchor="middle" fill="#071b24" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="750">Human approval</text>
  <text x="1385" y="582" text-anchor="middle" fill="#5d7077" font-family="Segoe UI, Arial, sans-serif" font-size="15">Then ERP sandbox</text>

  <g transform="translate(90 690)">
    <rect width="1420" height="180" rx="24" fill="#ffffff" opacity="0.96"/>
    <line x1="474" y1="35" x2="474" y2="145" stroke="#ccd9d6" stroke-width="2"/>
    <line x1="947" y1="35" x2="947" y2="145" stroke="#ccd9d6" stroke-width="2"/>

    <text x="237" y="91" text-anchor="middle" fill="#071b24" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="800">99.72%</text>
    <text x="237" y="125" text-anchor="middle" fill="#5d7077" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">FIELD MATCH</text>

    <text x="710" y="91" text-anchor="middle" fill="#071b24" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="800">95%</text>
    <text x="710" y="125" text-anchor="middle" fill="#5d7077" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ROUTE MATCH</text>

    <text x="1184" y="91" text-anchor="middle" fill="#071b24" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="800">53</text>
    <text x="1184" y="125" text-anchor="middle" fill="#5d7077" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">TESTS PASSED</text>
  </g>
</svg>
